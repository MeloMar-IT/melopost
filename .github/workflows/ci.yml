name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: No compiled binaries
        run: |
          out="$(git ls-files '*.class' '*.jar' '*.war')"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Docker available
        run: docker info
      - name: Build and test
        run: ./mvnw -B verify
      - name: No skipped tests, required tests ran
        run: |
          P=com.melomarit.melopost
          S=target/surefire-reports
          F=target/failsafe-reports
          for f in "$S/TEST-$P.repository.PostmortemRepositorySearchTest.xml" \
                   "$S/TEST-$P.controller.DatabaseAdminRestControllerIntegrationTest.xml" \
                   "$S/TEST-$P.controller.PostmortemNullSafetyTest.xml" \
                   "$F/TEST-$P.functional.PostmortemFunctionalTest.xml" \
                   "$F/TEST-$P.functional.RBACFunctionalTest.xml" \
                   "$F/TEST-$P.functional.UserManagementFunctionalTest.xml"; do
            test -s "$f" || { echo "Missing report: $f"; exit 1; }
            grep -q '<testcase' "$f" || { echo "No test cases in: $f"; exit 1; }
          done
          for f in "$S"/TEST-*.xml "$F"/TEST-*.xml; do
            if grep -q '<skipped' "$f"; then echo "Skipped tests in $f"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install fastapi uvicorn pydantic
      - run: python -m unittest discover -s tests/python -v

spring.application.name=melopost

# Default Profile
spring.profiles.active=dev

# Cassandra Configuration (Default values, can be overridden by profiles)
spring.cassandra.enabled=true
spring.cassandra.keyspace-name=melopost
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.contact-points=127.0.0.1
spring.cassandra.port=9042

# Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Sample data: only honoured with profile dev/test (never prod/acc). Never deletes data.
melopost.seed.enabled=false
# First admin, created only when the users table is empty (env var MELOPOST_ADMIN_INITIAL_PASSWORD)
melopost.admin.initial-password=${MELOPOST_ADMIN_INITIAL_PASSWORD:}

# Base64 of a 32-byte AES key for data-source tokens (env var MELOPOST_DATASOURCE_KEY, e.g. `openssl rand -base64 32`).
# Required in the prod and acc profiles.
melopost.datasource.key=${MELOPOST_DATASOURCE_KEY:}
